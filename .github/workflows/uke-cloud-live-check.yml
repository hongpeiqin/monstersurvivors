name: Verify Uke Studio cloud integration
on:
  push:
    branches: [uke-studio-demo]
    paths: [.github/workflows/uke-cloud-live-check.yml]
permissions: {}
jobs:
  live-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install isolated browser test dependencies
        run: |
          mkdir -p /tmp/uke-cloud-check
          cd /tmp/uke-cloud-check
          npm init -y >/dev/null
          npm install --save-exact playwright@1.55.1 >/tmp/npm-install.log
          npx playwright install chromium >/tmp/browser-install.log
      - name: Test the actual deployed app without provider credentials
        run: |
          cd /tmp/uke-cloud-check
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
          const errors = [];
          page.on('pageerror', e => errors.push(e.message));
          try {
            const response = await page.goto('https://uke-studio-uxr4x7.v2.appdeploy.ai/', { waitUntil: 'networkidle', timeout: 60000 });
            console.log('HTTP_STATUS', response.status());
            await page.locator('#refreshServices').click();
            await page.waitForFunction(() => document.getElementById('serviceStatus')?.innerText.includes('v0.3') || document.getElementById('serviceStatus')?.innerText.includes('不可达'), null, { timeout: 60000 });
            const services = await page.locator('#serviceStatus').innerText();
            console.log('SERVICE_STATUS', services);
            assert(services.includes('v0.3'), 'Backend status did not succeed');
            await page.locator('#tryCloud').click();
            await page.waitForFunction(() => !document.getElementById('tryCloud').disabled, null, { timeout: 120000 });
            console.log('CLOUD_MESSAGE', await page.locator('#cloudMessage').innerText());
            console.log('PLAN_TEXT', await page.locator('#planText').innerText());
            assert(await page.locator('#planPreview').isVisible(), 'The actual hosted AI did not return a usable plan');
            await page.locator('#applyPlan').click();
            assert.equal(await page.locator('#bpm').inputValue(), '72');
            assert.equal(await page.locator('#difficulty').inputValue(), '0');
            assert.equal(await page.locator('#maxFret').inputValue(), '5');
            assert.equal(await page.locator('#pattern').inputValue(), 'arp');
            await page.locator('#singView').click();
            const last = await page.locator('[data-accompaniment-system]').last().boundingBox();
            const legend = await page.locator('[data-chord-legend]').boundingBox();
            assert(legend.y > last.y, 'Chord legend must follow the continuous score');
            await page.locator('#tryCloud').click();
            await page.waitForFunction(() => !document.getElementById('tryCloud').disabled, null, { timeout: 60000 });
            assert((await page.locator('#planText').innerText()).includes('已缓存'), 'Repeat fixed demo must disclose caching');
            assert.deepEqual(errors, []);
            console.log('PASS: real deployed backend, hosted AI response, explicit application, cached-result disclosure and tail reference layout');
          } finally {
            console.log('FINAL_MESSAGE', await page.locator('#cloudMessage').innerText().catch(() => 'unavailable'));
            console.log('BROWSER_ERRORS', JSON.stringify(errors));
            await browser.close();
          }
          JS
